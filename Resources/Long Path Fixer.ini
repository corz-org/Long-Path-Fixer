;
;	Setting for Long Path Fixer..
;
;	Ini settings are usually either an integer (number), a Boolean (aka. "bool")
;	which is true or false, or a string of some kind (i.e. a name or file path).
;
;   Lines beginning ";", like the line you are reading right now, are ignored by
;	Long Path Fixer. i.e. "the comments".
;
;	Note: this ini file will be automatically upgraded by future versions of
;	Long Path Fixer, to ensure you have all the latest preferences and features.
;	Your current settings will remain intact, but any notes you might make here
;	will be archived to "<date> Long Path Fixer.ini", created during the upgrade
;	process.
;
;	Also note: if you mess up some setting, and want to get back the defaults,
;	simply rename or move this file, and run Long Path Fixer again; its default
;	ini will be re-placed.
;

[Long Path Fixer]

; Version number
;
; This is updated automatically and enables you to get automatic ini updating
; as well as check for new versions of Long Path Fixer at corz.org.
;
version=


;
; Text Editor					[string/path]	[default: editor=notepad.exe]
;
; We start with this setting - in case you are in Notepad right now, and can
; barely tell the comments and settings apart!
;
; Enter the path to your preferred text editor..
; This is invoked if you select the "edit preferences" menu option.
;
;editor=C:\Program Files\text ed\editplus\editplus.exe
editor=notepad.exe


;
; Show ToolTip Help							[bool]	[default: show_tips=true]
;
; Some helpful information when you hover your mouse over controls..
;
show_tips=true


;
; Create TaskBar Entry					[bool]	[default: taskbar_entry=true]
;
; If you prefer, you can disable the taskbar entry and control Long Path Fixer
; solely from the System Tray.
;
taskbar_entry=true


;
; Always-On-Top
;
; Set this to true to have the main Long Path Fixer always be on top of other
; Windows. You can set this from Long Path Fixer's Tray menu.
; NOTE: sometimes this fails on launch with no explanation! :/
;
always_on_top=false


;
; Hover mouse to show main window	[bool]		  [default: hover_to_show=true]
;
; If the Long Path Fixer window is behind other windows, but not minimized,
; you can hover the mouse over its tray icon to bring it to the front.
;
hover_to_show=true
;
; If Long Path Fixer is minimized, click the icon!


;
; Mouse Tray hover sensitivity..	[int]		  [default: hover_sensitivity=8]
;
; How fast Long Path Fixer activates depends on the hover_sensitivity.
; Enter an integer value: 1 - 10. 10 is fastest, basically immediately.
;
hover_sensitivity=8


;
; Fade-In							[bool]				 [default: fade_in=true]
;
; At launch, the main Long Path Fixer window fades in quickly, like a pulse, but
; you can disable that, if you like..
;
fade_in=true


;
; Dialog Font					[string]	[default: dialog_font=Consolas|8.5|400]
;
; The font used in all Long Path Fixer dialog windows. Three parts
; separated by | pipes: typeface name, size in points, weight number
; (400 is normal, 700 is bold). Weight must be a multiple of 100.
;
dialog_font=Segoe UI|10|400|0


;
; Path to LockHunter application.									 [file path]
;
; If Long Path Fixer can't find LockHunter in the specified location, it will
; ask you to manually locate it. If you don't have LockHunter installed, go get
; it! Seriously, you need this on your system!
;
unlocker_path=C:\Program Files\LockHunter\LockHunter.exe


;
; LockHunter switches		[string]	[default: unlocker_switches="-u -sm -x"]
;
; Of course, it's conceivable that you have some other program that can do a
; similar thing to LockHunter (i.e. unlock all the handles to a file/folder),
; in which case, you can enter its path above and set its command-line switches
; here.
;
unlocker_switches=-u -sm -x


;
; Explorer Context Menu			[bool]		[default: explorer_context=false]
;
; This puts Long Path Fixer in your directory context menu (what you get when
; you right-click directories in Explorer). Handy.
;
; You can set this from Long Path Fixer's System Tray menu.
;
explorer_context=false



;
; Delete to Recycle Bin		[bool]		[default: delete_to_recycle_bin=false]
;
; With this set to false, you will have to options in your menu, "Delete" and
; "Delete To Recycle Bin", and you can choose between them. If you set this
; to true, you will have only "Delete", and everything will go in the recycle
; bin automatically.
;
delete_to_recycle_bin=false



; Confirm Deletions..				[bool]		[default: confirm_delete=true]
;
; If you are extremely bold, you can disable the delete confirmations. If you
; set delete_to_recycle_bin=true (above) this can save some annoyance whilst
; still being relatively safe.
;
confirm_delete=true


;
; Automatic Version Checking.			[bool]	[default: version_checking=7]
;
; Long Path Fixer can check for new version of itself on exit.
;
version_checking=-1
;
; The date and time of the last check is stored here..
version_checked=


;
; Long Path Fixer main windows dimensions and placement.
;
; These are set automatically when you move/resize the main window.
;
x=-1
y=-1
width=800
height=450
